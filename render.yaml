services:
  - type: web
    name: jarvis-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jarvis.api.app:app --host 0.0.0.0 --port $PORT --lifespan on
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o
